[project]
name = "clinic-app"
version = "1.0.0"
description = "Система управления клиникой: учебное веб-приложение, сгенерированное ИИ по промптам (ЛР №12)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    # zoneinfo на Windows не содержит базы часовых поясов: без пакета tzdata
    # CLINIC_TIMEZONE=Europe/Moscow не проходит валидацию и приложение не стартует.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["prompts", "comparison/task6/solutions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "S101",  # assert в тестах
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"comparison/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async выполняет запросы через greenlet: без этого coverage теряет трассировку
# после переключения greenlet и недосчитывает строки сервисного слоя.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
