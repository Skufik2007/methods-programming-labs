[project]
name = "lab10-python-service"
version = "1.0.0"
description = "FastAPI-сервис ЛР №10: проверка JWT Go-сервиса, валидация заказов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "psutil>=6"]

# Настройки ruff — в ruff.toml в корне репозитория (общие для python/ и bench/).

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет app импортируется из корня python/ при любом способе запуска (pytest или python -m pytest).
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты с реальным Go-сервисом (нужен компилятор Go)"]
filterwarnings = [
    # Starlette предлагает перейти на httpx2 для TestClient; на поведение тестов не влияет.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
