<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Панель{% endblock %} — MAS</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <strong class="brand">MAS · поддержка пациентов</strong>
  <nav>
    <a href="/" {% if page == "overview" %}class="active" aria-current="page"{% endif %}>Обзор</a>
    <a href="/runs" {% if page == "runs" %}class="active" aria-current="page"{% endif %}>Запуски</a>
    <a href="/events" {% if page == "events" %}class="active" aria-current="page"{% endif %}>Журнал</a>
    <a href="/new" {% if page == "new" %}class="active" aria-current="page"{% endif %}>Ручной запуск</a>
  </nav>
  <span id="live-status" class="live" aria-live="polite"></span>
</header>
<main>
  <noscript><p class="note">JavaScript отключён: данные не обновляются сами, обновляйте страницу вручную.</p></noscript>
  {% block content %}{% endblock %}
</main>
</body>
</html>
