[project]
name = "mas"
version = "1.0.0"
description = "Мультиагентная система поддержки пациентов: оркестратор, LLM-агент, общие модули (ЛР №13)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "redis>=5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
"mas.dashboard" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["prompts", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "S101",  # assert в тестах
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC109"]  # фейковая шина повторяет сигнатуры MessageBus
"mas/orchestrator/demo.py" = ["S311"]
"mas/**" = ["ASYNC109"]  # параметр timeout в шине и API ожидания — осознанный

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["mas"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
