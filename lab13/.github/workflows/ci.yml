name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "reports/**"
      - "prompts/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "reports/**"
      - "prompts/**"

permissions:
  contents: read

# Новый запуск в той же ветке/PR отменяет устаревший.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go-агенты (vet, test -race, gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agents/go.mod
          cache: true # кэш модулей и сборки; ключ — по go.sum
          cache-dependency-path: agents/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатированы (gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover -count=1 ./...

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check mas tests scripts
      # Сервисный контейнер GitHub не принимает аргументы команды, а NATS нужен с флагом -js
      # (JetStream), поэтому сервер запускается обычным docker run.
      - name: NATS с JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11 -js -m 8222
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs nats
          exit 1
      - run: pytest --cov=mas --cov-report=term-missing --cov-report=xml
      - name: Остановить NATS
        if: always()
        run: docker rm -f nats

  compose:
    name: Compose и сквозная проверка
    needs: [go, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Искусственная задержка триажа: очередь растёт под нагрузкой, и автомасштабировщик добавляет экземпляры.
      TRIAGE_SLOW_MS: "800"
      REMINDER_DEMO_DELAY: 5s
      SURVEY_DEMO_DELAY: 10s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Проверка compose.yaml
        run: docker compose config --quiet
      - name: Сборка и запуск
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Сквозная проверка (фаза before)
        run: python scripts/e2e.py --phase before
      - name: Перезапуск reminder
        run: |
          docker compose restart reminder
          sleep 5
          docker compose ps reminder
      - name: Сквозная проверка (фаза after)
        run: python scripts/e2e.py --phase after
      - name: Логи сервисов (при провале)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
          docker ps -a --filter label=mas.autoscaler=1
      - name: Остановка и очистка
        if: always()
        run: |
          # Контейнеры, созданные автомасштабировщиком, compose не знает — убираем отдельно.
          ids="$(docker ps -aq --filter label=mas.autoscaler=1)"
          if [ -n "$ids" ]; then docker rm -f $ids; fi
          docker compose down -v --remove-orphans
