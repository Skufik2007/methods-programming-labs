# Стенд ЛР №14: эмулятор -> два сборщика (HRW через etcd) -> файлы / NATS JetStream / Arrow Flight
# -> потоковый анализ -> дашборд. Запуск: docker compose up -d --build --wait
name: vitals

x-collector-env: &collector-env
  SIM_URL: http://sensorsim:8080
  COORD: etcd
  ETCD_ENDPOINTS: etcd:2379
  NATS_URL: nats://nats:4222
  SINKS: files,nats,flight
  EMIT: both
  OUT_DIR: /data
  STATUS_ADDR: ":9100"
  FLIGHT_ADDR: ":8815"
  POLL_INTERVAL: 1s
  WINDOW: 10s

x-collector: &collector
  image: vitals-go:local
  build:
    context: .
    dockerfile: deploy/go.Dockerfile
  command: ["collector"]
  # SHUTDOWN_TIMEOUT сборщика 15 с — даём запас, чтобы он успел отозвать lease и записать чекпоинты
  stop_grace_period: 25s
  depends_on:
    sensorsim: {condition: service_healthy}
    etcd: {condition: service_healthy}
    nats: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.2
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports: ["2379:2379"]
    healthcheck:
      # в образе etcd нет оболочки и wget, но есть etcdctl
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.14-alpine
    # -js — JetStream, -m 8222 — HTTP-мониторинг (healthz и jsz для e2e)
    command: ["-js", "-sd", "/nats-data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  sensorsim:
    image: vitals-go:local
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
    command: ["sensorsim"]
    environment:
      ADDR: ":8080"
      DEVICES: "40"
      PERIOD_MS: "500"
      SEED: "14"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  collector-1:
    <<: *collector
    environment:
      <<: *collector-env
      COLLECTOR_ID: collector-1
      # адрес, который сборщик публикует в etcd: без него был бы 127.0.0.1
      FLIGHT_ADVERTISE: collector-1:8815
    volumes: ["data1:/data"]
    ports: ["9101:9100", "8815:8815"]

  collector-2:
    <<: *collector
    environment:
      <<: *collector-env
      COLLECTOR_ID: collector-2
      FLIGHT_ADVERTISE: collector-2:8815
    volumes: ["data2:/data"]
    ports: ["9102:9100", "8816:8815"]

  streaming:
    image: vitals-py:local
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    command: ["python", "-m", "vitals.streaming"]
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    depends_on:
      nats: {condition: service_healthy}
      collector-1: {condition: service_healthy}  # поток VITALS создаёт сборщик
    restart: unless-stopped

  dashboard:
    image: vitals-py:local
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    command: ["python", "-m", "vitals.dashboard"]
    environment:
      NATS_URL: nats://nats:4222
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8000"
      LOG_LEVEL: INFO
    ports: ["8000:8000"]
    depends_on:
      nats: {condition: service_healthy}
      streaming: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  data1: {}
  data2: {}
