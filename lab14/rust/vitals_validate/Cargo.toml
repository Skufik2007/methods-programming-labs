[package]
name = "vitals_validate"
version = "0.1.0"
edition = "2021"
description = "Валидация показаний носимых датчиков (ЛР14, задание 4)"

[lib]
name = "vitals_validate"
# cdylib — для Python-модуля; rlib — чтобы работал `cargo test`
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py312: один бинарь для всех Python >= 3.12
pyo3 = { version = "0.25", features = ["abi3-py312"] }
numpy = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
