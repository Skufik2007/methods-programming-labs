name: ci

on:
  push:
    paths-ignore: ["**.md", "reports/**", "prompts/**"]
  pull_request:
    paths-ignore: ["**.md", "reports/**", "prompts/**"]
  workflow_dispatch:

permissions:
  contents: read

# новый коммит отменяет предыдущий прогон той же ветки
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NATS_IMAGE: nats:2.14-alpine
  ETCD_IMAGE: quay.io/coreos/etcd:v3.7.2

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum  # кэш модулей и сборки Go
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Не отформатированы:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: test -race -cover
        run: go test -race -cover -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/vitals_validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vitals_validate
      # cargo test линкует тест-бинарник с libpython; ей нужен путь поиска
      - name: cargo test
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    env:
      # интеграционные тесты читают адреса из окружения; имена у компонентов разные
      NATS_URL: nats://localhost:4222
      ETCD_ENDPOINTS: localhost:2379
      ETCD_URL: http://localhost:2379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vitals_validate
      # сервисные контейнеры не принимают аргументы командной строки, поэтому docker run
      - name: NATS (JetStream) и etcd
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 "$NATS_IMAGE" -js -m 8222
          docker run -d --name etcd -p 2379:2379 "$ETCD_IMAGE" etcd \
            --data-dir=/etcd-data \
            --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://localhost:2379
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null && curl -fsS http://localhost:2379/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs nats; docker logs etcd; exit 1
      - name: Колесо Rust-валидатора (maturin)
        run: |
          pip install "maturin>=1.5,<2"
          maturin build --release --manifest-path rust/vitals_validate/Cargo.toml --out dist
      - name: Установка пакета и колеса
        run: pip install ".[dev]" dist/*.whl
      - run: ruff check .
      - name: pytest с покрытием
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Логи сервисов при провале
        if: failure()
        run: |
          docker logs nats
          docker logs etcd

  compose:
    needs: [go, rust, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow  # e2e.py ходит в Arrow Flight; остальное — стандартная библиотека
      - name: Сборка и запуск стенда
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Сквозная проверка
        run: python scripts/e2e.py --wait 60
      - name: Состояние и логи при провале
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps
      - name: Остановка стенда
        if: always()
        run: docker compose down -v

  k8s:
    needs: [go, rust, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NS: vitals
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа Go
        run: docker build -f deploy/go.Dockerfile -t vitals-go:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: vitals
      - name: Загрузка образа в kind
        run: kind load docker-image vitals-go:ci --name vitals
      - name: metrics-server (kubelet-insecure-tls для kind)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
          for i in $(seq 1 60); do
            if kubectl top nodes >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo "metrics API так и не заработал"; exit 1
      - name: Применение манифестов
        run: |
          kubectl apply -k k8s/
          for d in etcd nats sensorsim collector; do
            kubectl -n "$NS" rollout status deployment/"$d" --timeout=240s
          done
          kubectl -n "$NS" get pods -o wide
      - name: Начальное состояние сборщика
        run: |
          pod="$(kubectl -n "$NS" get pod -l app=collector -o name | head -n1)"
          kubectl -n "$NS" exec "$pod" -- wget -q -O - http://127.0.0.1:9100/status | head -c 600; echo
      - name: Нагрузка и ожидание роста HPA
        run: |
          mkdir -p k8s-out
          # больше устройств и чаще показания; затем перезапуск сборщиков: список устройств они кэшируют при старте
          kubectl -n "$NS" set env deployment/sensorsim DEVICES=3000 PERIOD_MS=50
          kubectl -n "$NS" rollout status deployment/sensorsim --timeout=180s
          kubectl -n "$NS" rollout restart deployment/collector
          kubectl -n "$NS" rollout status deployment/collector --timeout=180s
          ok=0
          for i in $(seq 1 72); do   # 72 * 5 с = 6 минут
            n="$(kubectl -n "$NS" get deployment collector -o jsonpath='{.status.readyReplicas}')"
            {
              echo "=== $(date -u +%T) readyReplicas=${n:-0} ==="
              kubectl -n "$NS" get hpa,pods
              kubectl -n "$NS" top pods || true
            } | tee -a k8s-out/hpa-watch.log
            if [ "${n:-0}" -gt 1 ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "HPA не поднял реплики сборщика за 6 минут"; exit 1; fi
          # новые реплики должны зарегистрироваться в etcd и получить устройства
          sleep 20
          for pod in $(kubectl -n "$NS" get pod -l app=collector -o name); do
            echo "--- $pod"
            kubectl -n "$NS" exec "$pod" -- wget -q -O - http://127.0.0.1:9100/status | head -c 300
            echo
          done | tee -a k8s-out/status.log
      - name: Диагностика
        if: always()
        run: |
          mkdir -p k8s-out
          {
            kubectl -n "$NS" get all,hpa -o wide
            kubectl -n "$NS" describe hpa collector
            kubectl -n "$NS" top pods || true
            kubectl -n "$NS" get events --sort-by=.lastTimestamp
          } > k8s-out/cluster.txt 2>&1 || true
          kubectl -n "$NS" logs -l app=collector --tail=200 --prefix > k8s-out/collector.log 2>&1 || true
          kubectl -n "$NS" logs deployment/sensorsim --tail=100 > k8s-out/sensorsim.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-output
          path: k8s-out/
          if-no-files-found: ignore
