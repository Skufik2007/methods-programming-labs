[project]
name = "vitals"
version = "1.0.0"
description = "Конвейер сбора и анализа данных датчиков здоровья: ETL, потоковый анализ, дашборд (ЛР №14)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "plotly>=5.22",
    "matplotlib>=3.8",
    "nats-py>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "tzdata; sys_platform == 'win32'",  # на Windows у Python нет базы часовых поясов, а Polars отдаёт datetime с tz=UTC
    # etcd3-py работает через HTTP gRPC-gateway (REST/JSON) etcd v3: не нужен protobuf/grpcio,
    # чистый Python, ставится на 3.12 без компиляции. Альтернатива (etcd3 на grpcio) тянет
    # старый protobuf, несовместимый с pyarrow/nats-окружением.
    "etcd3-py>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]
include = ["vitals*"]

# Веб-ресурсы дашборда — не .py, без этого их нет в колесе (находка №4: в Docker дашборд
# падал, локально editable-установка это скрывала).
[tool.setuptools.package-data]
"vitals.dashboard" = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["prompts", ".venv", "rust", "go"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC"]
ignore = [
    "S101",  # assert в тестах
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC109"]
"python/**" = ["ASYNC109"]  # параметр timeout в API ожидания — осознанный

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["python"]

[tool.coverage.run]
source = ["python/vitals"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
