# etcd: одна реплика без постоянного тома (стенд для CI). Данные — в emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: vitals
  labels: {app: etcd}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: etcd}
  template:
    metadata:
      labels: {app: etcd}
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.7.2
          command:
            - etcd
            - --name=etcd0
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd:2379
          ports:
            - {name: client, containerPort: 2379}
          volumeMounts:
            - {name: data, mountPath: /etcd-data}
          readinessProbe:
            exec:
              command: ["etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
            periodSeconds: 3
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: vitals
spec:
  selector: {app: etcd}
  ports:
    - {name: client, port: 2379, targetPort: client}
